<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O nama | Beauty of Quince - kozmetički salon, Beograd</title>
<meta name="description" content="Beauty of Quince radi od 2017. godine na istoj adresi na Zvezdari. Salon i kozmetičarka Jelena Đorđević-Nedić.">
<meta name="theme-color" content="#17130F">
<link rel="icon" href="uploads/logo.jpg">
<meta property="og:type" content="website">
<meta property="og:title" content="O nama | Beauty of Quince">
<meta property="og:description" content="Salon na Zvezdari od 2017. godine.">
<meta property="og:image" content="uploads/beauty-of-quince_1_md.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Beauty of Quince - stilovi */
:root{
  --ink:#17130F; --cream:#FBF8F4; --beige:#F1E7DA; --acc:#A87B4A; --acc-d:#7E5A2E;
  --line:rgba(23,19,15,0.12); --mut:#6E6155; --soft:#8B7E70; --gold:#E9D9B9; --gold-d:#C0A279;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:auto}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--acc);text-decoration:none}
a:hover{color:var(--acc-d)}
img{max-width:100%}
button{font-family:inherit;font-size:16px}
input,select,textarea{font-family:inherit;font-size:16px}
::selection{background:#E5D6C3}

@keyframes bqmarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes bqfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bqrise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bqflipN{0%{opacity:.2;transform:perspective(1600px) rotateY(-11deg) translateX(34px)}100%{opacity:1;transform:none}}
@keyframes bqflipP{0%{opacity:.2;transform:perspective(1600px) rotateY(11deg) translateX(-34px)}100%{opacity:1;transform:none}}

/* --- nav --- */
.navbar{position:fixed;top:14px;left:0;right:0;z-index:300;display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.nav{pointer-events:auto;width:100%;max-width:1120px;background:rgba(251,248,244,.94);backdrop-filter:saturate(140%) blur(6px);border:1px solid rgba(23,19,15,.1);border-radius:999px;box-shadow:0 14px 34px rgba(23,19,15,.13),0 2px 6px rgba(23,19,15,.05);display:flex;align-items:center;gap:18px;padding:10px 14px 10px 20px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;color:var(--ink)}
.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:50% 42%}
.brand span{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{background:none;border:0;cursor:pointer;font-size:14.5px;color:var(--ink);padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:6px;letter-spacing:.01em;transition:background .2s,color .2s}
.nav-link:hover{background:#F7F0E6}
.nav-link.act{background:var(--beige);color:var(--acc-d);box-shadow:inset 0 0 0 1px rgba(168,123,74,.35)}
.nav-spacer{flex:1 1 auto}
.flags{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.flag{background:none;border:1px solid transparent;border-radius:999px;padding:5px;cursor:pointer;line-height:0;opacity:.5;transition:opacity .2s}
.flag.on{background:var(--beige);border-color:rgba(168,123,74,.5);opacity:1}
.flag img{width:22px;height:22px;border-radius:3px;display:block}
.nav-phone{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.burger{display:none;flex-direction:column;gap:4px;background:none;border:1px solid var(--line);border-radius:999px;padding:10px 11px;cursor:pointer}
.burger i{display:block;width:18px;height:1.5px;background:var(--ink)}
.dd{position:absolute;top:36px;left:-14px;width:330px;background:var(--cream);border:1px solid rgba(23,19,15,.12);border-radius:14px;padding:8px;box-shadow:0 18px 40px rgba(23,19,15,.14);animation:bqfade .16s ease-out}
.dd a{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--ink);transition:background .15s,padding-left .15s}
.dd a:hover{background:var(--beige);padding-left:16px;color:var(--ink)}
.scrim{position:fixed;inset:0;z-index:290;background:rgba(23,19,15,.35)}
.msheet{position:fixed;top:78px;left:14px;right:14px;z-index:295;background:var(--cream);border:1px solid rgba(23,19,15,.12);border-radius:20px;padding:14px;box-shadow:0 20px 50px rgba(23,19,15,.18);animation:bqfade .18s ease-out;max-height:76vh;overflow-y:auto}
.m-link{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;text-align:left;padding:13px 14px;font-size:17px;color:var(--ink);cursor:pointer;border-bottom:1px solid rgba(23,19,15,.08)}
.m-sub{display:block;width:100%;background:none;border:0;text-align:left;padding:9px 14px 9px 28px;font-size:14px;color:var(--mut);cursor:pointer}
.m-chev{display:flex;align-items:center;line-height:0;flex:0 0 auto;transition:transform .22s}
.m-chev.open{transform:rotate(180deg)}
.m-call{display:block;margin-top:10px;padding:14px;text-align:center;background:var(--ink);color:var(--cream);border-radius:8px;font-size:15px;letter-spacing:.02em}
.m-call:hover{color:var(--cream)}

/* --- layout --- */
.sec{padding:104px 24px}
.sec--beige{background:var(--beige)}
.sec--dark{background:var(--ink)}
.sec--top{padding:160px 24px 40px}
.sec--notop{padding:24px 24px 104px}
.wrap{max-width:1100px;margin:0 auto}
.wrap-narrow{max-width:760px;margin:0 auto}
.grid2{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.grid2-tight{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:34px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:38px}
.offer-split{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:.82fr 1.18fr;gap:68px;align-items:start}
.rev-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:32px;margin-top:36px;align-items:start}
.gal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.foot-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:48px}

/* --- type --- */
h1,h2,h3,h4{margin:0}
.h1{font-family:var(--serif);font-weight:600;font-size:62px;line-height:1.04;letter-spacing:-.015em;margin:0 0 22px;max-width:20ch;text-wrap:pretty}
.h1--light{color:var(--cream);text-shadow:0 2px 24px rgba(0,0,0,.35)}
.h1s{font-family:var(--serif);font-weight:600;font-size:54px;line-height:1.08;margin:0 0 18px}
.h2{font-family:var(--serif);font-weight:600;font-size:43px;line-height:1.12;letter-spacing:-.01em;margin:0 0 18px;max-width:24ch;text-wrap:pretty}
.h2--light{color:var(--cream);margin:0}
.h3{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.2;margin:0}
.h4{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.25;margin:0 0 10px}
.p{font-size:17.5px;line-height:1.75;color:var(--mut);max-width:62ch;margin:0 0 16px}
.p-sm{font-size:15px;line-height:1.7;color:var(--mut);margin:0}
.lead{font-size:19px;line-height:1.65;color:#4A4038;max-width:54ch;margin:0}
.lead--light{color:rgba(251,248,244,.86);max-width:56ch}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:500;margin:0 0 16px}
.eyebrow--light{color:#C9A97A}
.quote{font-family:var(--serif);font-size:24px;font-style:italic;color:var(--acc);line-height:1.4}
.note{font-size:15px;color:var(--ink);border-left:2px solid var(--acc);padding-left:14px;margin:22px 0 0}

/* --- buttons --- */
.btn{background:var(--ink);color:var(--cream);border:0;border-radius:8px;padding:16px 28px;font-size:16px;letter-spacing:.02em;cursor:pointer;transition:transform .2s,box-shadow .2s;display:inline-block}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(23,19,15,.25);color:var(--cream)}
.btn--light{background:var(--gold);color:#241C12;padding:15px 26px;font-size:15.5px}
.btn--light:hover{color:#241C12;box-shadow:0 16px 32px rgba(0,0,0,.3)}
.btn--sm{padding:12px 20px;font-size:14.5px}
.pager{background:none;border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:13.5px;color:var(--ink);cursor:pointer;transition:border-color .2s}
.pager:hover{border-color:rgba(168,123,74,.6)}
.arrow{background:none;border:1px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:16px;color:var(--ink);cursor:pointer;transition:background .2s}
.arrow:hover{background:var(--beige)}
.arrow--sm{border-radius:8px;width:32px;height:32px;font-size:13px}
.fab{position:fixed;right:24px;bottom:24px;z-index:250;display:flex;align-items:center;gap:9px;background:var(--ink);color:var(--cream);border:1px solid rgba(251,248,244,.2);border-radius:999px;padding:15px 22px;font-size:15px;cursor:pointer;box-shadow:0 12px 30px rgba(23,19,15,.3);transition:transform .2s,box-shadow .2s}
.fab:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(23,19,15,.4)}

/* --- hero --- */
.hero{position:relative;overflow:hidden;display:flex;align-items:flex-end;min-height:760px;padding:190px 24px 96px;background:var(--ink)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero .ov1{position:absolute;inset:0;background:linear-gradient(100deg,rgba(18,14,10,.9) 0%,rgba(18,14,10,.74) 44%,rgba(18,14,10,.32) 100%)}
.hero .ov2{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,14,10,.5) 0%,rgba(18,14,10,.12) 38%,rgba(18,14,10,.92) 100%)}
.hero-in{position:relative;z-index:2;width:100%;max-width:1100px;margin:0 auto}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 32px}
.badge{border:1px solid rgba(251,248,244,.3);border-radius:999px;padding:8px 15px;font-size:13px;color:rgba(251,248,244,.9);background:rgba(251,248,244,.08);backdrop-filter:blur(3px)}
.wave{line-height:0;background:var(--ink)}
.wave svg{display:block;width:100%;height:70px}

/* --- images --- */
.img-tall{border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/4.2;box-shadow:0 18px 40px rgba(23,19,15,.1)}
.img-wide{border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;margin-top:22px}
.img-tall img,.img-wide img{width:100%;height:100%;object-fit:cover;display:block}

/* --- cards --- */
.cred-card{background:#FFFDFA;border:1px solid var(--line);border-radius:12px;padding:24px 22px;transition:transform .25s,box-shadow .25s,border-color .25s}
.cred-card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(23,19,15,.1);border-color:rgba(168,123,74,.45)}
.ico{width:42px;height:42px;border-radius:50%;background:var(--beige);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cred-hl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:14px 0 0;border-top:1px solid rgba(168,123,74,.28);padding-top:12px}
.check-list>div{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid rgba(23,19,15,.1);font-size:17px;line-height:1.55;color:#2C251E}
.check-list svg{flex:0 0 auto;margin-top:4px}
.pt-list{display:flex;flex-direction:column;gap:10px;margin:22px 0 0}
.pt-list div{display:flex;gap:11px;align-items:flex-start;font-size:15.5px;line-height:1.5;color:#2C251E}
.pt-list svg{flex:0 0 auto;margin-top:4px}
.offer-row{display:flex;gap:22px;align-items:flex-start;padding:24px 0;border-top:1px solid rgba(23,19,15,.16)}
.offer-num{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--gold-d);line-height:1;flex:0 0 auto;width:52px;padding-top:2px}
.offer-row h3{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2;margin:0 0 8px}
.band{position:relative;overflow:hidden;background:var(--ink);padding:128px 24px}
.band>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.band .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,14,10,.78) 0%,rgba(18,14,10,.62) 50%,rgba(18,14,10,.82) 100%)}
.band-in{position:relative;z-index:2;max-width:760px;margin:0 auto;text-align:center}
.band-q{font-family:var(--serif);font-size:38px;font-style:italic;font-weight:500;line-height:1.28;color:var(--cream);margin:0 0 30px}
.prod-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#FFFDFA;transition:transform .25s,box-shadow .25s}
.prod-card:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(23,19,15,.1)}
.prod-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.prod-card h3{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.2;margin:0 0 8px}
.rate-card{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:26px}
.rate-big{display:block;font-family:var(--serif);font-size:58px;font-weight:600;line-height:1;color:var(--ink)}
.rate-lbl{display:block;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:8px}
.bar{height:5px;border-radius:999px;background:#E5D6C3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .8s ease}
.rev-card{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;gap:16px;align-items:flex-start;transition:transform .2s,box-shadow .2s}
.rev-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(23,19,15,.09)}
.rev-card img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto}

/* --- popular marquee --- */
.mq-mask{overflow:hidden;padding:8px 0 6px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mq{display:flex;gap:20px;width:max-content;animation:bqmarquee 92s linear infinite}
.mq:hover{animation-play-state:paused}
.pop{position:relative;width:318px;min-height:430px;flex:0 0 auto;border-radius:12px;overflow:hidden;border:1px solid rgba(233,217,185,.5);background:var(--cream);display:flex;flex-direction:column;cursor:pointer;box-shadow:0 16px 36px rgba(0,0,0,.32);transition:transform .28s,box-shadow .28s;text-align:left}
.pop:hover{transform:translateY(-6px);box-shadow:0 26px 54px rgba(0,0,0,.45)}
.pop-img{position:relative;height:215px;flex:0 0 auto;overflow:hidden;background:#EFE4D6}
.pop-img img{width:100%;height:100%;object-fit:cover;display:block}
.pop-pill{position:absolute;top:12px;left:12px;background:rgba(251,248,244,.94);color:#3A2C17;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pop-body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1 1 auto}
.pop-cat{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin:0 0 8px}
.pop h3{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.15;margin:0 0 8px}
.pop-desc{font-size:13.5px;line-height:1.5;color:var(--mut);margin:0 0 16px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pop-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.pop-foot span:last-child{font-size:12px;color:var(--acc);white-space:nowrap}
.hatch{position:absolute;inset:0;background:repeating-linear-gradient(135deg,#E7DACA 0 12px,#DFD0BC 12px 24px)}

/* --- price list --- */
.price-col{max-width:940px;margin:0 auto}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 22px}
.price-head .p{max-width:60ch;margin:10px 0 0}
.tab{background:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13.5px;cursor:pointer;letter-spacing:.01em;transition:background .2s,color .2s}
.tab:hover{border-color:rgba(168,123,74,.6)}
.tab.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.book{display:block;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#FFFDFA;box-shadow:0 18px 44px rgba(23,19,15,.09)}
.book.fl-n{animation:bqflipN .5s cubic-bezier(.22,.7,.25,1) both;transform-origin:left center}
.book.fl-p{animation:bqflipP .5s cubic-bezier(.22,.7,.25,1) both;transform-origin:right center}
.book-left{position:relative;min-width:0;height:320px;display:flex;background:#EFE4D6}
.book-left>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.book-left .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,0) 40%,rgba(20,16,12,.75) 100%)}
.book-left .cap{position:relative;z-index:2;margin-top:auto;padding:26px}
.book-left .cap p{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(251,248,244,.75);margin:0 0 8px}
.book-left .cap h3{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1;color:var(--cream);margin:0}
.book-right{padding:28px 34px 30px;min-width:0;display:flex;flex-direction:column}
.book-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid rgba(23,19,15,.14)}
.book-head h3{font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 6px}
.hint{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--soft);margin:0}
.book-list{max-height:560px;overflow-y:auto;overflow-x:hidden;padding:4px 4px 4px 0;margin:4px 0 16px;flex:1 1 auto;min-width:0}
.row{padding:18px 10px 18px 12px;margin-bottom:2px;border-bottom:1px solid rgba(23,19,15,.09);transition:background .2s}
.row.sel{background:rgba(168,123,74,.07);border-radius:8px}
.row-top{display:flex;gap:13px;align-items:flex-start;cursor:pointer}
.box{flex:0 0 auto;width:20px;height:20px;margin-top:2px;border-radius:5px;border:1.5px solid rgba(23,19,15,.28);background:#FFFDFA;display:flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s}
.row.sel .box{background:var(--ink);border-color:var(--ink)}
.row-name{flex:1 1 auto;min-width:0}
.row-name>p{font-size:16px;line-height:1.35;margin:0}
.row-right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right;padding-left:8px}
.row-price{font-size:15.5px;white-space:nowrap}
.row-dur{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--soft);white-space:nowrap}
.row-name .off{display:inline-flex;align-items:center;gap:8px;margin-top:8px}
.row-name .off b{font-weight:400;font-size:12px;color:#2F7A55;border:1px solid rgba(47,122,85,.35);background:rgba(47,122,85,.08);border-radius:999px;padding:3px 9px}
.row-name .off s{font-size:13px;color:#A79A8B}
.row-desc{margin-top:9px;padding-left:33px}
.row-desc p{font-size:14.5px;line-height:1.65;color:var(--mut);margin:0}
.row-desc p.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;padding:0;margin-top:6px;font-size:13px;color:var(--acc);cursor:pointer;border-bottom:1px solid rgba(168,123,74,.35)}
.row-book{margin-top:14px;padding-left:33px;animation:bqrise .24s ease-out}
.pagers{display:flex;align-items:center;justify-content:center;gap:14px;padding-top:18px;border-top:1px solid rgba(23,19,15,.14)}
.pg{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:46px;height:46px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s}
.pg:hover{background:var(--beige);border-color:rgba(168,123,74,.6)}

/* --- faq --- */
.faq{display:flex;flex-direction:column;gap:10px}
.faq-item{border:1px solid var(--line);border-radius:10px;background:transparent;transition:border-color .2s,background .2s}

.faq-q{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;width:100%;background:none;border:0;padding:18px 20px;cursor:pointer;text-align:left;font-size:16.5px;line-height:1.4;color:var(--ink)}
.faq-sign{font-size:22px;line-height:1;color:var(--acc);flex:0 0 auto;transition:transform .25s}
.faq-item.on .faq-sign{transform:rotate(45deg)}
.faq-a{font-size:15.5px;line-height:1.75;color:var(--mut);margin:0;padding:0 20px 20px;animation:bqrise .24s ease-out}

.hours span:first-child{color:#4A4038}
.map{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:360px;background:#EFE4D6}
.map iframe{width:100%;height:100%;min-height:360px;border:0;display:block}
.c-rows{display:flex;flex-direction:column;gap:10px;margin:4px 0 30px}
.c-row{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:15px 18px;background:#FFFDFA;transition:background .2s,border-color .2s;color:var(--ink)}
.c-row:hover{border-color:rgba(168,123,74,.5);background:#F7F0E6;color:var(--ink)}
.c-lbl{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.c-val{display:block;font-size:16px;color:var(--ink);word-break:break-word}
.form-card{background:#F7F0E6;border:1px solid var(--line);border-radius:12px;padding:32px}
.form{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.label{display:flex;flex-direction:column;gap:7px;font-size:13px;letter-spacing:.02em;color:#4A4038}
.input{border:1px solid var(--line);border-radius:8px;padding:13px 14px;background:#FFFDFA;color:var(--ink);width:100%}
.input:focus{outline:0;border-color:rgba(168,123,74,.6)}
.err{font-size:13px;color:#B03A2E;margin:0;min-height:18px}
.ok{border:1px solid rgba(47,122,85,.35);background:rgba(47,122,85,.07);border-radius:10px;padding:26px;font-size:16px;color:#2F7A55;margin-top:18px}

/* --- booking modal --- */
.ovl{position:fixed;inset:0;z-index:400;background:rgba(23,19,15,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal{width:100%;max-width:680px;background:var(--cream);border-radius:14px;padding:32px;margin:60px 0 40px;box-shadow:0 30px 70px rgba(23,19,15,.35);animation:bqrise .28s ease-out}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.modal-head h3{font-family:var(--serif);font-size:28px;font-weight:600}
.x{background:none;border:0;font-size:30px;line-height:1;color:var(--mut);cursor:pointer}
.bars{display:flex;gap:6px;margin-bottom:26px}
.bars i{flex:1;height:3px;border-radius:999px;background:rgba(23,19,15,.15)}
.bars i.on{background:var(--ink)}
.chosen{border:1px solid rgba(23,19,15,.14);border-radius:10px;padding:18px;background:#FFFDFA;margin-bottom:26px}
.chosen p:first-child{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:0 0 8px}
.chosen .nm{font-size:17px;line-height:1.35;margin:0 0 10px}
.chosen .meta{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--mut)}
.field-h{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:stretch}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:100px;gap:3px;padding:12px 6px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#FFFDFA;color:var(--ink);transition:background .2s,color .2s,border-color .2s}
.day b{font-size:20px;line-height:1.2;font-family:var(--serif);font-weight:600}
.day u{font-size:11px;line-height:1.3;letter-spacing:.1em;text-transform:uppercase;opacity:.7;text-decoration:none}
.day i{font-size:10px;opacity:.7;font-style:normal;line-height:1.3;min-height:13px;white-space:nowrap}
.day.off{cursor:not-allowed;background:rgba(23,19,15,.04);color:#B3A897;opacity:.7}
.day.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.slot{border:1px solid var(--line);border-radius:8px;padding:10px 4px;font-size:14px;cursor:pointer;background:#FFFDFA;color:var(--ink);transition:background .15s,color .15s}
.slot.taken{cursor:not-allowed;background:rgba(23,19,15,.05);color:#B3A897;text-decoration:line-through}
.slot.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.staff{display:flex;flex-direction:column;gap:8px}
.staff-opt{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#FFFDFA;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s;font-size:15px;text-align:left}
.staff-opt.on{border-color:var(--ink);background:rgba(168,123,74,.08)}
.staff-opt i{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(23,19,15,.3);flex:0 0 auto}
.staff-opt.on i{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px #FFFDFA}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row-btns{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.done{text-align:center;padding:20px 0}
.done .circle{width:56px;height:56px;border-radius:50%;border:1px solid #2F7A55;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.done h3{font-family:var(--serif);font-size:30px;font-weight:600;margin:0 0 14px}

/* --- gallery --- */
.folder{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:#EFE4D6;display:flex;transition:box-shadow .25s}
.folder:hover{box-shadow:0 20px 40px rgba(23,19,15,.18)}
.folder>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.folder .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,0) 45%,rgba(20,16,12,.78) 100%)}
.folder .cap{position:relative;z-index:2;margin-top:auto;padding:20px}
.folder h3{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--cream);margin:0 0 4px;line-height:1.15}
.folder p{font-size:12px;color:rgba(251,248,244,.75);margin:0}
.gal-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;cursor:pointer;display:block;border:1px solid rgba(23,19,15,.1)}
.empty{border:1px dashed rgba(23,19,15,.2);border-radius:10px;padding:60px 24px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.1em;color:var(--soft)}
.lb{position:fixed;inset:0;z-index:420;background:rgba(23,19,15,.9);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;animation:bqfade .18s ease-out}
.lb img{max-width:min(1100px,92vw);max-height:88vh;border-radius:6px;display:block}
.lb button{position:fixed;top:20px;right:24px;background:none;border:0;color:var(--cream);font-size:34px;cursor:pointer;line-height:1}

/* --- footer --- */
.foot{background:var(--ink);color:rgba(251,248,244,.72);padding:64px 24px 40px}
.foot-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.foot-brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:50% 42%}
.foot-brand span{font-family:var(--serif);font-size:22px;color:var(--cream)}
.foot-h{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#C9A97A;margin:0 0 14px}
.foot a{color:rgba(251,248,244,.72)}
.foot a:hover{color:var(--gold)}
.foot-links a{display:block;font-size:14px;padding:0 0 8px;line-height:1.5}
.foot-bot{border-top:1px solid rgba(251,248,244,.16);margin-top:40px;padding-top:20px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:13px}

/* --- reveal --- */
.rv{opacity:0;transform:translateY(24px);transition:opacity .75s cubic-bezier(.2,.7,.3,1),transform .75s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}
.rv-s{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.rv-s.in{opacity:1;transform:none}

  .h1{font-size:48px}

}

      '<label class="label" style="margin-top:16px">' + esc(l.formNoteOpt) + '<textarea class="input" rows="3" data-f="note">' + esc(st.note) + '</textarea></label>' +
      '<p style="font-size:14px;color:#6E6155;margin:18px 0 0">' + esc(B.pay) + '</p>' +
      '<div class="row-btns"><button class="pager" data-act="bback">&larr; ' + esc(B.back) + '</button>' +
      '<button class="btn" data-act="bsubmit">' + esc(B.submit) + '</button><span class="err">' + esc(st.err) + '</span></div></div>';
    return '<div class="ovl"><div class="modal">' +
      '<div class="modal-head"><div><p class="eyebrow">' + esc(B.step + ' ' + st.step + ' ' + B.of + ' 2 \u00b7 ' + (st.step === 1 ? B.s1 : B.s2)) + '</p>' +
      '<h3>' + esc(B.title) + '</h3></div><button class="x" data-act="bclose">&times;</button></div>' +
      '<div class="bars"><i class="on"></i><i' + (st.step === 2 ? ' class="on"' : '') + '></i></div>' +
      '<div class="chosen"><p>' + esc(B.chosen) + '</p><p class="nm">' + esc(st.bk.name) + '</p>' +
      '<div class="meta"><span>' + st.bk.m + ' ' + esc(l.min) + '</span><span style="color:#17130F">' + fmt(st.bk.p) + ' ' + esc(l.rsd) + '</span><span>' + esc(st.bk.cat) + '</span></div></div>' +
      (st.step === 1 ? step1 : step2) + '</div></div>';
  }
  function summary() {
    if (!st.bk) return '';
    var l = L(), d = st.date ? new Date(st.date + 'T00:00:00') : null;
    var txt = d ? (l.days[d.getDay()] + ' ' + d.getDate() + '. ' + l.months[d.getMonth()]) : '';
    return st.bk.name + ' \u00b7 ' + txt + ' \u00b7 ' + (st.time || '') + ' \u00b7 ' + (D.STAFF[0] ? D.STAFF[0].name : '');
  }
  function lightbox() {
    return st.lb ? '<div class="lb" data-act="lbclose"><img src="' + st.lb + '" alt=""><button data-act="lbclose">&times;</button></div>' : '';
  }

  /* ---------- render ---------- */
  function render(opts) {
    var keep = !(opts && opts.top);
    var sy = window.scrollY, bl = document.querySelector('.book-list'), lst = bl ? bl.scrollTop : 0;
    var body = page === 'about' ? about() : page === 'gallery' ? gallery() :
      hero() + problem() + solution() + creds() + benefits() + popular() + priceList() +
      reviews() + products() + offer() + faq() + locationSec() + contact();
    document.getElementById('app').innerHTML = nav() + body + footer() + fab() + modal() + lightbox();
    document.documentElement.lang = st.lang === 's' ? 'sr' : 'en';
    reveal();
    if (keep) {
      var b2 = document.querySelector('.book-list');
      if (b2 && lst) b2.scrollTop = lst;
      if (Math.abs(window.scrollY - sy) > 1) window.scrollTo({ top: sy, behavior: 'auto' });
    } else window.scrollTo({ top: 0, behavior: 'auto' });
  }
  var seen = [];
  function reveal() {
    var els = document.querySelectorAll('.rv,.rv-s'), vh = window.innerHeight, i, el, r;
    for (i = 0; i < els.length; i++) {
      el = els[i];
      if (el.classList.contains('in')) continue;
      if (el.className.indexOf('rv-s') > -1 && !el.style.transitionDelay) {
        var idx = Array.prototype.indexOf.call(el.parentNode.children, el);
        el.style.transitionDelay = ((idx % 12) * 45) + 'ms';
      }
      r = el.getBoundingClientRect();
      if (r.top < vh * 0.92) el.classList.add('in');
    }
  }
  function trackActive() {
    if (page !== 'home') return;
    var y = window.innerHeight * 0.42, cur = null;
    ['cenovnik', 'faq', 'kontakt'].forEach(function (id) {
      var el = document.getElementById(id); if (!el) return;
      var r = el.getBoundingClientRect();
      if (r.top <= y && r.bottom >= 100) cur = id;
    });
    if (cur !== st.active) {
      st.active = cur;
      var links = document.querySelectorAll('.nav-links .nav-link');
      if (links.length === 4) {
        links[0].classList.toggle('act', cur === 'cenovnik');
        links[3].classList.toggle('act', cur === 'kontakt');
      }
    }
  }
  function jump(id) {
    var el = document.getElementById(id); if (!el) return;
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: 'auto' });
  }
  function jumpList() {
    var lst = document.querySelector('.book-right') || document.querySelector('.book-list');
    if (!lst) return jump('cenovnik');
    var bl = document.querySelector('.book-list');
    if (bl) bl.scrollTop = 0;
    var top = lst.getBoundingClientRect().top + window.scrollY - 92;
    window.scrollTo({ top: Math.max(0, top), behavior: 'auto' });
  }
  function jumpItem(id) {
    var el = document.getElementById('svc-' + String(id).replace(/:/g, '-'));
    if (!el) return jump('cenovnik');
    var list = el.parentNode;
    if (list && list.scrollHeight > list.clientHeight + 4) list.scrollTop = Math.max(0, el.offsetTop - list.offsetTop - 10);
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 120, behavior: 'auto' });
  }
  function findItem(id) {
    var p = String(id).split(':'), i;
    for (i = 0; i < D.CATS.length; i++) if (D.CATS[i].id === p[0]) return { cat: D.CATS[i], it: D.CATS[i].items[+p[1]] };
    return null;
  }
  function setCat(i, dir, sel) {
    var n = D.CATS.length;
    st.catIdx = ((i % n) + n) % n;
    st.sel = sel || null;
    st.flip = dir;
    st.flipTick++;
    render();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v'), id = el.getAttribute('data-id');
    var i = el.getAttribute('data-i'), l = L(), sr = st.lang === 's';

    if (act === 'lang') { st.lang = v; localStorage.setItem('bq-lang', v); st.dd = false; render(); return; }
    if (act === 'dd') { st.dd = !st.dd; render(); return; }
    if (act === 'menu') { st.menu = !st.menu; render(); return; }
    if (act === 'closemenu') { st.menu = false; st.mSvc = false; render(); return; }
    if (act === 'msvc') { st.mSvc = !st.mSvc; render(); return; }
    if (act === 'toprice') { if (page === 'home') { e.preventDefault(); jump('cenovnik'); } else location.href = PAGES.home + '#cenovnik'; return; }
    if (act === 'kontakt') { if (page === 'home') { e.preventDefault(); st.menu = false; render(); jump('kontakt'); } return; }
    if (act === 'cat') {
      e.preventDefault();
      var cid = D.CATS[+i] ? D.CATS[+i].id : '';
      try { sessionStorage.setItem('bq-cat', cid); } catch (er) {}
      if (page !== 'home') { location.href = PAGES.home + '?usluga=' + cid + '#cenovnik'; return; }
      st.menu = false; st.dd = false; st.mSvc = false;
      setCat(+i, +i < st.catIdx ? 'p' : 'n');
      try { history.replaceState(null, '', PAGES.home + '?usluga=' + cid + '#cenovnik'); } catch (er2) {}
      setTimeout(function () { jump('cenovnik'); }, 40);
      return;
    }
    if (act === 'pg') { setCat(st.catIdx + (v === 'p' ? -1 : 1), v); jumpList(); requestAnimationFrame(jumpList); return; }
    if (act === 'sel') {
      var prevSel = st.sel;
      st.sel = prevSel === id ? null : id;
      var mark = function (rid, on) {
        if (!rid) return true;
        var r = document.getElementById('svc-' + String(rid).replace(/:/g, '-'));
        if (!r) return false;
        var box = r.querySelector('.box'), bk = r.querySelector('.row-book');
        if (on) {
          r.classList.add('sel');
          if (box) box.innerHTML = ICO.checkWhite;
          if (!bk) {
            var d = document.createElement('div');
            d.className = 'row-book';
            d.innerHTML = '<button class="btn btn--sm" data-act="book" data-id="' + esc(rid) + '">' + esc(l.book) + '</button>';
            r.appendChild(d);
          }
        } else {
          r.classList.remove('sel');
          if (box) box.innerHTML = '';
          if (bk) bk.parentNode.removeChild(bk);
        }
        return true;
      };
      if (!(mark(prevSel, false) && mark(st.sel, true))) render();
      return;
    }
    if (act === 'more') {
      st.exp[id] = !st.exp[id];
      var wrap = el.parentNode, pEl = wrap ? wrap.querySelector('p') : null;
      if (pEl) {
        if (st.exp[id]) pEl.classList.remove('clamp'); else pEl.classList.add('clamp');
        el.textContent = st.exp[id] ? l.less : l.more;
      } else render();
      return;
    }
    if (act === 'pop') {
      e.preventDefault();
      setCat(+i, 'n', id);
      setTimeout(function () { jumpItem(id); }, 60);
      return;
    }
    if (act === 'book') {
      var f = findItem(id); if (!f) return;
      st.bk = { name: svcName(f.it), m: f.it.m, p: f.it.p, cat: t(f.cat.n) };
      st.step = 1; st.date = null; st.time = null; st.done = false; st.err = '';
      render(); return;
    }
    if (act === 'prod') { st.prodPage += +v; render(); return; }
    if (act === 'faq') { st.faq = st.faq === +i ? -1 : +i; render(); return; }
    if (act === 'folder') { st.gal = id; render({ top: true }); return; }
    if (act === 'galback') { st.gal = null; render({ top: true }); return; }
    if (act === 'lb') { st.lb = el.getAttribute('data-src'); render(); return; }
    if (act === 'lbclose') { st.lb = null; render(); return; }
    if (act === 'bclose') { st.bk = null; st.done = false; render(); return; }
    if (act === 'day') { st.date = v; st.time = null; st.err = ''; render(); return; }
    if (act === 'slot') { st.time = v; st.err = ''; render(); return; }
    if (act === 'staff') { st.staff = v; render(); return; }
    if (act === 'week') { st.weekOff += +v; render(); return; }
    if (act === 'bnext') {
      if (!st.date || !st.time) { st.err = l.booking.needDate; render(); return; }
      st.step = 2; st.err = ''; render(); return;
    }
    if (act === 'bback') { st.step = 1; st.err = ''; render(); return; }
    if (act === 'bsubmit') {
      if (!st.fn.trim() || !st.ln.trim() || !st.em.trim() || !st.ph.trim()) { st.err = sr ? 'Popunite sva obavezna polja.' : 'Fill in all required fields.'; render(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(st.em.trim())) { st.err = sr ? 'Unesite ispravan mejl, sa @ u adresi.' : 'Enter a valid email address with @.'; render(); return; }
      if (st.ph.replace(/\D/g, '').length < 8) { st.err = sr ? 'Unesite ispravan broj telefona, samo cifre.' : 'Enter a valid phone number, digits only.'; render(); return; }
      st.done = true; st.err = ''; render(); return;
    }
    if (act === 'csend') {
      if (!st.cName.trim() || !st.cEm.trim() || !st.cNote.trim()) { st.cErr = sr ? 'Popunite sva obavezna polja.' : 'Fill in all required fields.'; render(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(st.cEm.trim())) { st.cErr = sr ? 'Unesite ispravan mejl, sa @ u adresi.' : 'Enter a valid email address with @.'; render(); return; }
      if (st.cPh.trim() && st.cPh.replace(/\D/g, '').length < 8) { st.cErr = sr ? 'Unesite ispravan broj telefona.' : 'Enter a valid phone number.'; render(); return; }
      st.cSent = true; st.cErr = ''; render(); return;
    }
  });

  document.addEventListener('input', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-f');
    if (!f) return;
    var val = e.target.value;
    if (f === 'ph' || f === 'cPh') { val = val.replace(/[^0-9+ ]/g, ''); e.target.value = val; }
    st[f] = val;
  });

  var raf = 0;
  window.addEventListener('scroll', function () {
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = 0; trackActive(); reveal(); });
  }, { passive: true });
  var rz;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(render, 180); });

  /* deep link: ?usluga=<id> */
  (function () {
    var q = new URLSearchParams(location.search).get('usluga'), s = null;
    try { s = sessionStorage.getItem('bq-cat'); sessionStorage.removeItem('bq-cat'); } catch (er) {}
    if (page === 'home') {
      var key = q || s;
      if (key) for (var i = 0; i < D.CATS.length; i++) if (D.CATS[i].id === key) { st.catIdx = i; break; }
    }
    if (q && page === 'gallery') st.gal = q;
    /* keep every image the sections swap through warm in the browser cache */
    var pre = [], j;
    for (j = 0; j < D.CATS.length; j++) if (D.CATS[j].img) pre.push(D.CATS[j].img);
    for (j = 0; j < D.PRODUCTS.length; j++) if (D.PRODUCTS[j].img) pre.push(D.PRODUCTS[j].img);
    if (D.POPULAR_IMG) Object.keys(D.POPULAR_IMG).forEach(function (k) { if (D.POPULAR_IMG[k]) pre.push(D.POPULAR_IMG[k]); });
    setTimeout(function () { pre.forEach(function (u) { var im = new Image(); im.decoding = 'async'; im.src = u; }); }, 300);
  })();

  render();
  (function () {
    var sp = document.getElementById("splash");
    if (!sp) return;
    sp.className = "off";
    setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 450);
  })();
  if (location.hash) setTimeout(function () { jump(location.hash.slice(1)); }, 80);
})();

</script>
</body>
</html>
